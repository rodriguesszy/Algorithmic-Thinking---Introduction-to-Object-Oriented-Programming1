<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RentSmart - R.M Imóveis</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--ac:#0f6e56;--bd:#dedbd2;--hl:#e6f3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--tx:#ececE8;--mut:#9a9990;--ac:#4cc3a0;--bd:#37393c;--hl:#1d3a31}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--tx:#ececE8;--mut:#9a9990;--ac:#4cc3a0;--bd:#37393c;--hl:#1d3a31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0}.sub{color:var(--mut);margin:2px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
select,input[type=number]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd)}
.row.tot{font-weight:700;font-size:1.15rem;color:var(--ac);border-bottom:none;background:var(--hl);padding:10px;border-radius:8px;margin-top:6px}
.desc{color:var(--mut);margin:0 0 8px}
h2{font-size:1rem;margin:0 0 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd);font-size:.9rem}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700;background:var(--hl)}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>RentSmart</h1>
<p class="sub">Orçamento de locação · R.M Imóveis</p>

<div class="card">
  <label for="tipo">Tipo de imóvel</label>
  <select id="tipo"><option value="ap">Apartamento</option><option value="casa">Casa</option><option value="est">Estúdio</option></select>
  <div id="g-quartos"><label for="quartos">Quartos</label>
    <select id="quartos"><option value="1">1 quarto</option><option value="2">2 quartos</option></select></div>
  <div id="g-garagem"><label for="garagem">Vaga de garagem</label>
    <select id="garagem"><option value="n">Não</option><option value="s">Sim</option></select></div>
  <div id="g-criancas"><label for="criancas">Possui crianças?</label>
    <select id="criancas"><option value="s">Sim</option><option value="n">Não</option></select></div>
  <div id="g-vagas" class="hide"><label for="vagas">Vagas de estacionamento (0 a 10; pacote inicial = 2 vagas)</label>
    <input type="number" id="vagas" min="0" max="10" value="0"></div>
  <label for="parcelas">Parcelas da taxa contratual</label>
  <select id="parcelas"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
</div>

<div class="card" id="orc"></div>
<div class="card"><h2>Projeção de 12 meses</h2><div class="scroll"><table id="proj"></table></div></div>
</main>
<script>
var TAXA=2000, $=function(i){return document.getElementById(i)};
var moeda=function(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var r2=function(v){return Math.round(v*100)/100};

function calc(){
  var t=$('tipo').value, q=+$('quartos').value, g=$('garagem').value==='s', c=$('criancas').value==='s';
  var v=Math.max(0,Math.min(10,parseInt($('vagas').value)||0)), p=+$('parcelas').value;
  var base,ad=[],desc=null,d;
  if(t==='ap'||t==='casa'){
    base=t==='ap'?700:900;
    if(q===2)ad.push(['Segundo quarto',t==='ap'?200:250]);
    if(g)ad.push(['Vaga de garagem',300]);
    d=(t==='ap'?'Apartamento':'Casa')+' de '+q+' quarto(s), '+(g?'com':'sem')+' garagem'+(t==='ap'?', '+(c?'com':'sem')+' crianças':'');
  } else {
    base=1200;
    if(v>0){ad.push(['Pacote de 2 vagas',250]);var e=Math.max(0,v-2);if(e)ad.push([e+' vaga(s) extra(s) x '+moeda(60),e*60]);}
    d='Estúdio com '+v+' vaga(s) de estacionamento';
  }
  var sub=base;ad.forEach(function(a){sub+=a[1]});
  var vd=0;
  if(t==='ap'&&!c){vd=sub*0.05;desc=['Desconto 5% (sem crianças)',vd];}
  var alug=r2(sub-vd);
  var val=r2(TAXA/p),parc=[];for(var i=0;i<p;i++)parc.push(val);
  parc[p-1]=r2(TAXA-val*(p-1));

  var h='<p class="desc">'+d+'</p><div class="row"><span>Aluguel-base</span><span>'+moeda(base)+'</span></div>';
  ad.forEach(function(a){h+='<div class="row"><span>+ '+a[0]+'</span><span>'+moeda(a[1])+'</span></div>'});
  h+='<div class="row"><span>Subtotal</span><span>'+moeda(sub)+'</span></div>';
  if(desc)h+='<div class="row"><span>- '+desc[0]+'</span><span>'+moeda(desc[1])+'</span></div>';
  h+='<div class="row tot"><span>ALUGUEL MENSAL</span><span>'+moeda(alug)+'</span></div>';
  h+='<p class="desc" style="margin-top:14px">Taxa contratual (cobrada à parte do aluguel)</p>';
  h+='<div class="row"><span>Valor da taxa</span><span>'+moeda(TAXA)+'</span></div>';
  h+='<div class="row"><span>Parcelamento</span><span>'+p+'x de '+moeda(parc[0])+'</span></div>';
  $('orc').innerHTML=h;

  var T='<thead><tr><th>Mês</th><th>Aluguel</th><th>Parcela da taxa</th><th>Total do mês</th></tr></thead><tbody>',sa=0,st=0,sm=0;
  for(var m=1;m<=12;m++){
    var tx=m<=p?parc[m-1]:0,tot=r2(alug+tx);sa+=alug;st+=tx;sm+=tot;
    T+='<tr><td>'+m+'</td><td>'+moeda(alug)+'</td><td>'+moeda(tx)+'</td><td>'+moeda(tot)+'</td></tr>';
  }
  T+='</tbody><tfoot><tr><td>Total</td><td>'+moeda(r2(sa))+'</td><td>'+moeda(r2(st))+'</td><td>'+moeda(r2(sm))+'</td></tr></tfoot>';
  $('proj').innerHTML=T;
}
function ui(){
  var t=$('tipo').value;
  $('g-quartos').classList.toggle('hide',t==='est');
  $('g-garagem').classList.toggle('hide',t==='est');
  $('g-criancas').classList.toggle('hide',t!=='ap');
  $('g-vagas').classList.toggle('hide',t!=='est');
  calc();
}
['tipo'].forEach(function(i){$(i).addEventListener('change',ui)});
['quartos','garagem','criancas','vagas','parcelas'].forEach(function(i){$(i).addEventListener('input',calc)});
ui();
</script>
</body>
</html>
